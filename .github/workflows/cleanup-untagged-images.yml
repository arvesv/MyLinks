name: Cleanup Untagged Container Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate cleanup without deleting images (dry run)'
        type: boolean
        required: false
        default: false
      package_name:
        description: 'GHCR package name to clean up'
        type: string
        required: false
        default: 'mylinks'

jobs:
  cleanup:
    name: Delete Untagged Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete untagged images from GitHub Container Registry
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          package: ${{ inputs.package_name || 'mylinks' }}
          delete-untagged: true
          dry-run: ${{ inputs.dry_run || false }}
