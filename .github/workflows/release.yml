name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only if "custom" is selected, e.g. 0.4.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Prepare Release & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      raw_version: ${{ steps.bump.outputs.raw_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and automated tests
        run: |
          npm run lint
          npm test

      - name: Bump version & Update files
        id: bump
        run: |
          TARGET="${{ inputs.bump }}"
          if [ "$TARGET" = "custom" ]; then
            TARGET="${{ inputs.custom_version }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Custom version was selected but left empty!"
            exit 1
          fi
          node scripts/bump-version.js "$TARGET"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add package.json package-lock.json docker-compose.yml README.md
          git commit -m "chore: release ${{ steps.bump.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.bump.outputs.version }}" -m "Release ${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --target "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes

  publish-container:
    name: Build & Publish Container
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag_name: ${{ needs.release.outputs.version }}
