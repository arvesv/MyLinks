name: Build and Publish Container Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '[0-9]+.*'
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.4.0)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}

      - name: Get Git commit info
        id: git_info
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and automated tests
        run: |
          npm run lint
          npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=match,pattern=v(.*),group=1,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || inputs.tag_name != '' || github.event_name == 'release' }}
            type=sha,format=short

      - name: Get build timestamp
        id: time
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ steps.git_info.outputs.sha }}
            GIT_BRANCH=${{ inputs.tag_name != '' && inputs.tag_name || (github.event_name == 'release' && github.event.release.tag_name) || github.ref_name }}
            BUILD_TIME=${{ steps.time.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
